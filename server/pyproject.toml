[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "culpeper-server"
version = "0.1.0"
description = "Flask API (SSE streaming) for the Culpeper Seance."
requires-python = ">=3.11"
# Depends on sibling `culpeper-agent` and `culpeper-rag` (see agent/pyproject.toml).
dependencies = [
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
