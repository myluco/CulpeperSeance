[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "culpeper-rag"
version = "0.1.0"
description = "Corpus handling for the Culpeper Seance: download, parse, chunk, embed, persist, retrieve."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-chroma>=0.2",
    "langchain-ollama>=0.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pytest>=8",
]

[project.scripts]
culpeper-ingest = "rag.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
